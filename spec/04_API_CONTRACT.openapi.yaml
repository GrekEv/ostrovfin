openapi: 3.1.0
info:
  title: Ostrovok Intelligence API
  version: 2.0.0-draft
  description: 'Проектный контракт этапа 1; не является утверждением о реализованных в исходном репозитории маршрутах.'
servers:
  - url: http://localhost:8080
security:
  - sessionAuth: []
tags:
  - name: Intelligence
  - name: Enrichment
  - name: Hotelier
  - name: Review
  - name: Quality
paths:
  /api/v2/intelligence/features:
    get:
      tags: [Intelligence]
      summary: Список доступных характеристик
      responses:
        '200':
          description: Реестр активных характеристик
          content:
            application/json:
              schema:
                type: object
                properties:
                  features:
                    type: array
                    items: {$ref: '#/components/schemas/FeatureDefinition'}
    post:
      tags: [Review]
      summary: Создать/обновить определение признака (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeatureDefinition'}
      responses:
        '201': {description: Добавлено}
        '400': {description: Ошибка схемы/неизвестный инструмент}
        '403': {description: Требуется admin}
  /api/v2/intelligence/hotels/{hotelId}/profile:
    get:
      tags: [Intelligence]
      summary: Достоверный профиль отеля с разрешёнными фактами
      parameters:
        - $ref: '#/components/parameters/hotelId'
        - in: query
          name: valid_at
          schema: {type: string, format: date}
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HotelProfile'}
        '404': {description: Отель не найден}
  /api/v2/intelligence/hotels/{hotelId}/evidence:
    get:
      tags: [Intelligence]
      summary: Утверждения и происхождение по признаку
      parameters:
        - $ref: '#/components/parameters/hotelId'
        - in: query
          name: feature_key
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Свидетельства
          content:
            application/json:
              schema:
                type: object
                properties:
                  assertions:
                    type: array
                    items: {$ref: '#/components/schemas/FactAssertion'}
  /api/v2/intelligence/search:
    post:
      tags: [Intelligence]
      summary: Структурированный поиск с доказательствами
      operationId: searchHotels
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: Результаты с объяснениями
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '422': {description: Некорректный запрос}
  /api/v2/intelligence/jobs/enrich:
    post:
      tags: [Enrichment]
      summary: Запустить обогащение по отелю и списку признаков
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotel_id, feature_keys]
              properties:
                hotel_id: {type: string, format: uuid}
                feature_keys:
                  type: array
                  minItems: 1
                  items: {type: string}
                visit_window: {$ref: '#/components/schemas/VisitWindow'}
                mode: {type: string, enum: [demo, live], default: demo}
      responses:
        '202':
          description: Задача поставлена в очередь
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobAccepted'}
        '403': {description: Нет прав на обогащение}
        '409': {description: Конфликт ключа идемпотентности}
  /api/v2/intelligence/jobs/{jobId}:
    get:
      tags: [Enrichment]
      summary: Статус исследования и попытки инструментов
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Статус
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobStatus'}
        '404': {description: Задача не найдена}
  /api/v2/intelligence/hotelier/questions:
    post:
      tags: [Hotelier]
      summary: Создать уточняющий вопрос (service/reviewer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotel_id, feature_keys, question]
              properties:
                hotel_id: {type: string, format: uuid}
                feature_keys:
                  type: array
                  items: {type: string}
                question: {type: string, minLength: 8}
                reason: {type: string, enum: [unknown, stale, conflicted, low_confidence]}
      responses:
        '201': {description: Вопрос создан}
        '403': {description: Нет прав}
  /api/v2/intelligence/hotelier/questions/{questionId}/answer:
    post:
      tags: [Hotelier]
      summary: Ответ отельера с извлечением нескольких кандидатов
      parameters:
        - name: questionId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1}
                language: {type: string, default: ru}
      responses:
        '200':
          description: Ответ и кандидаты полей; не означает подтверждённого факта
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer_id: {type: string, format: uuid}
                  status: {type: string, enum: [needs_confirmation, extracted, needs_review]}
                  candidates:
                    type: array
                    items: {$ref: '#/components/schemas/ExtractionCandidate'}
        '403': {description: Отельер не закреплён за объектом}
  /api/v2/intelligence/hotelier/answers/{answerId}/confirm:
    post:
      tags: [Hotelier]
      summary: Подтвердить/скорректировать кандидатов ответа
      parameters:
        - name: answerId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidates]
              properties:
                candidates:
                  type: array
                  items: {$ref: '#/components/schemas/ExtractionCandidate'}
      responses:
        '200': {description: Кандидаты приняты; пересчёт статуса инициирован}
        '403': {description: Отельер не закреплён за объектом}
  /api/v2/intelligence/conflicts/{conflictId}/resolve:
    post:
      tags: [Review]
      summary: Решение рецензента с обязательным обоснованием
      parameters:
        - name: conflictId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [accept_assertion, leave_open, split_context]}
                assertion_id: {type: [string, 'null'], format: uuid}
                reason: {type: string, minLength: 10}
      responses:
        '200': {description: Решение записано в аудит}
        '403': {description: Требуется reviewer/admin}
  /api/v2/intelligence/metrics:
    get:
      tags: [Quality]
      summary: Фактически измеренные метрики, не целевые KPI
      responses:
        '200':
          description: Отчёт о покрытии и точности
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot_at: {type: string, format: date-time}
                  hotels_count: {type: integer}
                  feature_coverage: {type: number, minimum: 0, maximum: 1}
                  verified_share: {type: number, minimum: 0, maximum: 1}
                  unknown_share: {type: number, minimum: 0, maximum: 1}
                  conflicts_open: {type: integer}
                  hotelier_escalation_rate: {type: number, minimum: 0, maximum: 1}
                  labeled_items: {type: integer}
                  precision: {type: [number, 'null'], minimum: 0, maximum: 1}
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Серверная сессия после валидации Telegram initData или сервисный RBAC токен.
  parameters:
    hotelId:
      name: hotelId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    VisitWindow:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
    FeatureDefinition:
      type: object
      required: [key, version, label, data_type, scope, ttl_days, strategy]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_]+$'}
        version: {type: integer, minimum: 1}
        label: {type: string}
        description: {type: string}
        data_type: {type: string, enum: [boolean, integer, number, string, money, object]}
        scope: {type: string, enum: [hotel, room_type, hotel_date, room_date]}
        unit: {type: [string, 'null']}
        ttl_days: {type: integer, minimum: 1}
        strategy: {type: string, enum: [source, derived, hotelier, hybrid]}
        calculator_key: {type: [string, 'null']}
    FactAssertion:
      type: object
      required: [assertion_id, hotel_id, feature_key, value, status, method, confidence, observed_at, retrieved_at, source]
      properties:
        assertion_id: {type: string, format: uuid}
        hotel_id: {type: string, format: uuid}
        feature_key: {type: string}
        subject_type: {type: string, enum: [hotel, room_type]}
        subject_id: {type: [string, 'null']}
        value: {}
        unit: {type: [string, 'null']}
        status: {type: string, enum: [verified, estimated, reported, conflicted, unknown, stale]}
        method: {type: string, enum: [observed, derived, hotelier_reported]}
        confidence: {type: number, minimum: 0, maximum: 1}
        confidence_basis: {type: string}
        observed_at: {type: string, format: date-time}
        retrieved_at: {type: string, format: date-time}
        valid_from: {type: [string, 'null'], format: date}
        valid_to: {type: [string, 'null'], format: date}
        algorithm_version: {type: [string, 'null']}
        context: {type: object, additionalProperties: true}
        source: {$ref: '#/components/schemas/SourceReference'}
    SourceReference:
      type: object
      required: [source_id, type, external_id, retrieved_at]
      properties:
        source_id: {type: string, format: uuid}
        type: {type: string, enum: [osm, wikidata, wikipedia, commons, mapillary, city, hotelier, calculation, demo]}
        external_id: {type: string}
        url: {type: [string, 'null'], format: uri}
        retrieved_at: {type: string, format: date-time}
        license: {type: [string, 'null']}
        checksum_sha256: {type: [string, 'null']}
    ResolvedFact:
      type: object
      required: [feature_key, status, assertion_ids]
      properties:
        feature_key: {type: string}
        value: {}
        status: {type: string, enum: [verified, estimated, reported, conflicted, unknown, stale]}
        assertion_ids:
          type: array
          items: {type: string, format: uuid}
        explanation: {type: string}
        context: {type: object, additionalProperties: true}
    HotelProfile:
      type: object
      required: [hotel_id, name, facts]
      properties:
        hotel_id: {type: string, format: uuid}
        name: {type: string}
        city: {type: string}
        facts:
          type: array
          items: {$ref: '#/components/schemas/ResolvedFact'}
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 3}
        region: {type: string, default: sochi-pilot}
        limit: {type: integer, minimum: 1, maximum: 50, default: 10}
        visit_window: {$ref: '#/components/schemas/VisitWindow'}
        hard_filters:
          type: object
          additionalProperties: true
    SearchResponse:
      type: object
      required: [request_id, criteria, results]
      properties:
        request_id: {type: string, format: uuid}
        criteria:
          type: array
          items:
            type: object
            properties:
              feature_key: {type: string}
              op: {type: string}
              value: {}
              priority: {type: string, enum: [hard, soft]}
        results:
          type: array
          items:
            type: object
            required: [hotel_id, score, matches]
            properties:
              hotel_id: {type: string, format: uuid}
              score: {type: number, minimum: 0, maximum: 100}
              matches:
                type: array
                items:
                  type: object
                  properties:
                    feature_key: {type: string}
                    status: {type: string, enum: [match, partial, mismatch, unknown, conflicted]}
                    explanation: {type: string}
                    assertion_ids:
                      type: array
                      items: {type: string, format: uuid}
              caveats:
                type: array
                items: {type: string}
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, const: queued}
    JobStatus:
      type: object
      required: [job_id, status, steps]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, partial, completed, failed, cancelled]}
        steps:
          type: array
          items:
            type: object
            properties:
              tool: {type: string}
              state: {type: string}
              started_at: {type: [string, 'null'], format: date-time}
              finished_at: {type: [string, 'null'], format: date-time}
              error_code: {type: [string, 'null']}
    ExtractionCandidate:
      type: object
      required: [feature_key, value, confidence, raw_excerpt]
      properties:
        feature_key: {type: string}
        value: {}
        unit: {type: [string, 'null']}
        confidence: {type: number, minimum: 0, maximum: 1}
        raw_excerpt: {type: string}
        context: {type: object, additionalProperties: true}
        needs_confirmation: {type: boolean}
